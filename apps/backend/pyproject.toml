[project]
name = "applyai-backend"
version = "0.1.0"
description = "ApplyAI FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "google-cloud-storage==3.11.0",
    "google-cloud-firestore==2.27.0",
    "google-adk>=2.2.0",
    "deprecated==1.3.1",
    "python-docx==1.2.0",
    "llama-cloud>=2.8.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "playwright==1.60.0",
    "langsmith[google-adk]>=0.8.9",
    "firebase-admin>=7.4.0",
    "openai>=2.41.0",
    "litellm>=1.88.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.16",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
