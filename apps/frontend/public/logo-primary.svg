<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
    </style>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="16" width="48" height="48" rx="12" fill="#6C5CE7"/>

  <!-- Resume doc -->
  <rect x="12" y="23" width="18" height="24" rx="3" fill="white"/>
  <line x1="15" y1="30" x2="27" y2="30" stroke="#A99FF5" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="15" y1="34" x2="27" y2="34" stroke="#A99FF5" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="15" y1="38" x2="23" y2="38" stroke="#A99FF5" stroke-width="1.3" stroke-linecap="round"/>

  <!-- AI check badge -->
  <circle cx="33" cy="45" r="8" fill="#5A4BD1"/>
  <path d="M30 45 L32.5 47.5 L37 42.5" stroke="#FFD166" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gold spark -->
  <circle cx="39" cy="26" r="3" fill="#FFD166"/>
  <path d="M37 26 L34 29" stroke="#FFD166" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Wordmark: ApplyAI together -->
  <text x="62" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="30" fill="#1A1440" letter-spacing="-0.8">Apply<tspan font-weight="700" fill="#6C5CE7">AI</tspan></text>

  <!-- Tagline -->
  <text x="63" y="63" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="12" fill="#8B85C1" letter-spacing="0.2">Job applications, automated.</text>
</svg>
